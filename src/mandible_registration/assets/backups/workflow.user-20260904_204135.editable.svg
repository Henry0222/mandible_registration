  <title
     id="title1">口扫与 CT 颌骨位姿传递</title>
  <desc
     id="desc1">上颌口扫.2 配准到上颌口扫.1，同步变换下颌口扫.2。全牙列配准到下颌口扫.1，传递矩阵生成颌骨.1。以下颌口扫.1 到对齐后的下颌口扫.2 的位移变换颌骨.1，生成颌骨.2，最后对比测量。界面状态由 Qt 更新；原始 SVG 保留可编辑文本与语义元素。</desc>
